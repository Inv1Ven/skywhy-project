<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поделиться скином</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; padding: 30px; }
        .form-container { max-width: 500px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333; }
        h1 { color: #ff8c00; margin-top: 0; font-size: 24px; }
        .success-msg { background: #00c853; color: #000; padding: 15px; border-radius: 4px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        
        p { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #ddd; }
        input[type="text"], input[type="email"], textarea { 
            width: 100%; padding: 10px; background: #222; border: 1px solid #444; 
            color: #fff; border-radius: 4px; box-sizing: border-box; 
        }
        input:focus, textarea:focus { border-color: #ff8c00; outline: none; }
        
        .btn-submit { 
            background: #ff8c00; color: #000; padding: 12px 20px; border: none; 
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px;
        }
        .btn-submit:hover { background: #ffaa33; }
        .errorlist { color: #ff4444; font-size: 14px; margin: 5px 0; padding-left: 0; list-style: none; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="form-container">
        {% if sent %}
            <h1>✅ Письмо отправлено!</h1>
            <div class="success-msg">
                Скин "{{ task.title }}" был успешно отправлен на {{ form.cleaned_data.to }}.
            </div>
            <a href="{{ task.get_absolute_url }}" class="back-link">← Вернуться к скину</a>
        
        {% else %}
            <h1>📤 Поделиться "{{ task.title }}"</h1>
            
            <form method="post">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <button type="submit" class="btn-submit">ОТПРАВИТЬ ПИСЬМО</button>
            </form>

            <a href="{{ task.get_absolute_url }}" class="back-link">← Вернуться к скину</a>
        {% endif %}
    </div>

</body>
</html>
